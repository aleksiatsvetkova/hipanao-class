# =====================================================================
# HIPANAO SOLUTIONS - Apache Virtual Host
#
# File to edit on your machine:
#     C:\xampp\apache\conf\extra\httpd-vhosts.conf
#     (or D:\xampp\apache\conf\extra\httpd-vhosts.conf)
#
# Open it in Notepad AS ADMINISTRATOR, paste the block below at the very
# bottom, save, then restart Apache from the XAMPP Control Panel.
#
# IMPORTANT: adjust the drive letter in the two paths below if your XAMPP
# is not on C:. Everything else can stay as-is.
# =====================================================================


# --- keep plain http://localhost/ working -----------------------------
# Once ANY vhost exists, Apache stops serving the default htdocs unless
# you declare it too. Without this block http://localhost/ and
# http://localhost/phpmyadmin would both break.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require local
    </Directory>
</VirtualHost>


# --- HIPANAO SOLUTIONS -------------------------------------------------
<VirtualHost *:80>
    ServerName hipanao-class.local
    ServerAlias www.hipanao-class.local
    DocumentRoot "C:/xampp/htdocs/hipanao-class"

    ErrorLog  "logs/hipanao-class-error.log"
    CustomLog "logs/hipanao-class-access.log" common

    <Directory "C:/xampp/htdocs/hipanao-class">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require local
    </Directory>
</VirtualHost>


# =====================================================================
# NOTE: for this to work, httpd.conf must have the vhosts file included.
# Open C:\xampp\apache\conf\httpd.conf, search for "httpd-vhosts.conf",
# and make sure the line is NOT commented out:
#
#     Include conf/extra/httpd-vhosts.conf
#
# If it starts with a #, delete the # and save.
# =====================================================================
